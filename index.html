<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سواعد الأمل | ENSAM Casablanca</title>
<meta name="description" content="سواعد الأمل — نادي اجتماعي بمدرسة ENSAM الدار البيضاء. التغيير يبدأ منا.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/sawaid-logo-social.png">
<meta property="og:type" content="website">
<meta property="og:title" content="سواعد الأمل | ENSAM Casablanca">
<meta property="og:description" content="سواعد الأمل — نادي اجتماعي بمدرسة ENSAM الدار البيضاء. التغيير يبدأ منا.">
<meta property="og:image" content="assets/sawaid-logo-social.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="سواعد الأمل | ENSAM Casablanca">
<meta name="twitter:description" content="سواعد الأمل — نادي اجتماعي بمدرسة ENSAM الدار البيضاء. التغيير يبدأ منا.">
<meta name="twitter:image" content="assets/sawaid-logo-social.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="zellige-bg" aria-hidden="true"></div>

<main class="page">

  <h1 class="visually-hidden" id="page-title">سواعد الأمل — ENSAM Casablanca</h1>

  <!-- ===== LANGUAGE SWITCH ===== -->
  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" class="lang-btn" data-lang="ar">ع</button>
    <button type="button" class="lang-btn" data-lang="fr">FR</button>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
  </div>

  <!-- ===== HERO ===== -->
  <section class="hero">
    <span class="hero-finial" aria-hidden="true"></span>
    <div class="hero-glow" aria-hidden="true"></div>

    <div class="logo-tile">
      <img class="hero-logo" src="assets/logo.svg" alt="شعار نادي سواعد الأمل - ENSAM Casablanca">
    </div>

    <p class="hero-tagline">
      <span class="tagline-ar" data-i18n="tagline">التغيير يبدأ مِنّا</span>
      <span class="tagline-en" dir="ltr" data-i18n="taglineEn">Change Starts With Us</span>
    </p>

    <p class="hero-pillars" data-i18n="pillars">
      <span>تواصل</span><span class="dot">•</span><span>تطوع</span><span class="dot">•</span><span>أثر</span>
    </p>
  </section>

  <!-- ===== QUICK SOCIAL ROW ===== -->
  <nav class="social-row" aria-label="روابط التواصل الاجتماعي">
    <!-- Populated from the SOCIALS array in js/script.js -->
  </nav>

  <!-- ===== LINKS LIST ===== -->
  <section class="links" aria-label="روابط النادي">
    <!-- Populated from the LINKS array in js/script.js -->
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="footer-divider" aria-hidden="true">
      <span></span><span class="footer-star"></span><span></span>
    </div>
    <p class="footer-name"></p>
    <p class="footer-school" dir="ltr"></p>
    <p class="footer-slogan"></p>
  </footer>

</main>

<script src="js/script.js"></script>
</body>
</html>
